# Inline JWKS instead of jwks_url (ADR 0006) — for hospitals that can't host
# their own JWKS endpoint. Public key parts only; Terraform rejects any key
# carrying private members (d, p, q, dp, dq, qi, oth, k).
# Quote the JWK member names: YAML 1.1 decodes an unquoted n: / y: key as a
# boolean, which Terraform rejects.
# Demo key: matching private key is keys/hospital_e-l2.key.
jwks:
  keys:
