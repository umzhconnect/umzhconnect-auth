# UMZH Connect realm client scopes
#
# Terraform (scopes.tf) reads this file to:
#   1. Create each scope as a keycloak_openid_client_scope resource.
#   2. Register every scope as an optional scope on every hospital M2M
#      client, so a caller may request any of them explicitly via the
#      token request's `scope` parameter.
#
# No scope is ever included by default. A caller that doesn't request a
# scope does not receive it, regardless of what other scopes it's entitled
# to request — least privilege per request, not per client.
#
# Scope names follow the SMART Backend Services (system-level) convention.
# The suffix letters encode FHIR interactions: r=read, s=search, c=create, u=update.
# See https://hl7.org/fhir/smart-app-launch/scopes-and-launch-context.html

scopes:
  - name: "system/Task.crus"
    description: "SMART system scope: create/read/update/search Tasks"
  - name: "system/ServiceRequest.rs"
    description: "SMART system scope: read and search ServiceRequests"
  - name: "system/Patient.rs"
    description: "SMART system scope: read and search Patient demographics"
  - name: "system/Condition.rs"
    description: "SMART system scope: read and search Conditions"
  - name: "system/MedicationStatement.rs"
    description: "SMART system scope: read and search MedicationStatements"
  - name: "system/Medication.rs"
    description: "SMART system scope: read and search  Medications"
  - name: "system/AllergyIntolerance.rs"
    description: "SMART system scope: read and search AllergyIntolerances"
  - name: "system/Coverage.rs"
    description: "SMART system scope: read and search Coverage (insurance)"
  - name: "system/Observation.rs"
    description: "SMART system scope: read and search Observations"
  - name: "system/Procedure.rs"
    description: "SMART system scope: read and search Procedures"
  - name: "system/Immunization.rs"
    description: "SMART system scope: read and search Immunizations"
  - name: "system/DiagnosticReport.rs"
    description: "SMART system scope: read and search DiagnosticReports"
  - name: "system/DocumentReference.rs"
    description: "SMART system scope: read and search DocumentReferences"
  - name: "system/QuestionnaireResponse.rs"
    description: "SMART system scope: read and search QuestionnaireResponses"
  - name: "system/Questionnaire.rs"
    description: "SMART system scope: read and search Questionnaires"
  - name: "system/ImagingStudy.rs"
    description: "SMART system scope: read and search ImagingStudies"
  - name: "system/Organization.rs"
    description: "SMART system scope: read and search Organizations"
  - name: "system/Practitioner.rs"
    description: "SMART system scope: read and search Practitioners"
  - name: "system/PractitionerRole.rs"
    description: "SMART system scope: read and search PractitionerRoles"
  - name: "system/Appointment.rs"
    description: "SMART system scope: read and search Appointments"
