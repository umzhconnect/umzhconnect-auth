fhir_server_key: "fhir-hospital-b"

# Hospital B grants access to its FHIR server.
# All three applications of Hospital A are granted access.
# Keys match the app filename convention: {org_id}--{app_id}.
grants:
  hospital-a--his:
    scopes:
      - "system/Patient.r"
      - "system/Task.cru"
      - "system/Condition.r"
      - "system/Practitioner.r"

  hospital-a--ris:
    scopes:
      - "system/Patient.r"
      - "system/ImagingStudy.r"
      - "system/DiagnosticReport.r"

  hospital-a--oncology:
    scopes:
      - "system/Patient.r"
      - "system/Condition.r"
      - "system/Task.cru"
      - "system/Observation.r"
      - "system/MedicationStatement.r"
