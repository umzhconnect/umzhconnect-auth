name: CI - token-validator image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (defaults to short SHA)"
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - "token-validator/**"
      - ".github/workflows/ci-token-validator.yml"
      - ".github/workflows/build-image.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    uses: ./.github/workflows/build-image.yml
    with:
      image: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-token-validator
      context: token-validator
      target: prodimage
      tag: ${{ inputs.tag }}
