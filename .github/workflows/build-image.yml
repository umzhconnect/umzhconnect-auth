name: Build and push image

on:
  workflow_call:
    inputs:
      image:
        description: "Full GHCR image reference, e.g. ghcr.io/<owner>/<repo>-keycloak"
        required: true
        type: string
      context:
        description: "Docker build context"
        required: false
        type: string
        default: "."
      file:
        description: "Path to Dockerfile (defaults to <context>/Dockerfile)"
        required: false
        type: string
        default: ""
      target:
        description: "Dockerfile build target stage"
        required: false
        type: string
        default: ""
      tag:
        description: "Image tag to publish (defaults to short SHA)"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Resolve tag
        id: tag
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "${TAG}" ]; then
            TAG="${GITHUB_SHA:0:8}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.file || format('{0}/Dockerfile', inputs.context) }}
          target: ${{ inputs.target }}
          push: true
          tags: |
            ${{ inputs.image }}:${{ steps.tag.outputs.tag }}
            ${{ inputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
