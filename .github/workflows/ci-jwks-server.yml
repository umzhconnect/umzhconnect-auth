name: CI - jwks-server image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (defaults to short SHA)"
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - "jwks-server/**"
      - "keys/*.jwks.json"
      - ".github/workflows/ci-jwks-server.yml"
      - ".github/workflows/build-image.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    uses: ./.github/workflows/build-image.yml
    with:
      image: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-jwks
      context: .
      file: jwks-server/Dockerfile
      tag: ${{ inputs.tag }}
