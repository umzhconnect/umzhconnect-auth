# One-shot Terraform apply against the running Keycloak. Runs as an ArgoCD
# PostSync hook so it re-applies after every sync, once Keycloak is reachable.
#
# Image is this template's own "configurator" image (../configurator/Dockerfile),
# which layers keycloak-config/ on top of your tf-config image (Terraform
# module baked in at /src/terraform by your own tf-config Dockerfile). Both
# /src/terraform and /src/config are already in the image, so no ConfigMap
# is needed - onboarding a client is "add a file under keycloak-config/clients/,
# rebuild the configurator image", not a kustomize edit. Terraform state must
# still survive Job re-runs (otherwise every sync would try to re-create an
# already-existing realm), so files are copied onto a persistent workspace
# volume on every start, and only the tfstate there is kept across runs.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tf-workspace
  namespace: example-app
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  storageClassName: default
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-config
  namespace: example-app
  annotations:
    argocd.argoproj.io/hook: PostSync
    # BeforeHookCreation must be included explicitly - specifying hook-delete-policy
    # replaces ArgoCD's default (BeforeHookCreation) rather than adding to it. Without
    # it, a failed Job (e.g. transient Keycloak unavailability during a sync) would
    # persist, and the next sync's identical-spec Job creation would be a no-op against
    # the existing failed Job - terraform would never re-run.
    #
    # HookSucceeded is deliberately omitted: it would delete the Job (and its pod
    # logs) the instant it succeeds, leaving nothing to inspect. Leaving it out
    # means the most recently finished Job (success or failure) sticks around
    # until the next sync's BeforeHookCreation clears it out.
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: regcred
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: terraform-apply
          image: ghcr.io/example-org/example-app-configurator
          workingDir: /workspace/terraform
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          command:
            - sh
            - -c
            - |
              mkdir -p /workspace/terraform /workspace/config
              cp -rf /src/terraform/. /workspace/terraform/
              cp -rf /src/config/. /workspace/config/
              terraform init -input=false
              terraform apply -auto-approve -input=false
          env:
            - name: TF_VAR_keycloak_url
              value: http://keycloak:8080
            - name: TF_VAR_keycloak_admin_username
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin
                  key: admin-username
            - name: TF_VAR_keycloak_admin_password
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin
                  key: admin-password
            # Explicit opt-in to provision keycloak-config/clients/*-l1.yaml
            # (see ADR 0004 in the main repo). Defaults to "false" so copying
            # this template doesn't silently enable L1 debug clients - flip to
            # "true" per-deployment if you actually need one provisioned.
            - name: TF_VAR_allow_l1_debug_clients
              value: "false"
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: tf-workspace
        - name: tmp
          emptyDir: {}
