# Keycloak bootstrap admin credentials, pulled from Vault rather than baked
# in here since Keycloak is internet-exposed in this template.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: keycloak-admin
  namespace: example-app
spec:
  refreshInterval: "15s"
  secretStoreRef:
    name: example-vault
    kind: ClusterSecretStore
  target:
    name: keycloak-admin
  data:
    - secretKey: admin-username
      remoteRef:
        key: ops/example-app/dev
        property: KEYCLOAK_USERNAME
    - secretKey: admin-password
      remoteRef:
        key: ops/example-app/dev
        property: KEYCLOAK_PASSWORD
