# Example realm client scopes, read by Terraform to:
#   1. Create each scope as a keycloak_openid_client_scope resource.
#   2. Register every scope as an optional scope on every M2M client, so a
#      caller may request any of them explicitly via the `scope` parameter.
#      No scope is ever included by default.

scopes:
  - name: "example/Resource.r"
    description: "Example scope: read Resource"
  - name: "example/Resource.cru"
    description: "Example scope: create/read/update Resource"
  - name: "example-optional-read"
    description: "Example optional scope: read additional data"
