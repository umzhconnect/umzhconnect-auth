# Example M2M client onboarding file. Terraform reads one file per client
# (all *.yaml in this ConfigMap directory except scopes.yaml) to create a KC
# client + its JWKS-based trust anchor. Add one file per client to onboard;
# there is no implicit access - a client with no file here has no KC client
# and cannot obtain tokens.
#
# Kept flat (not under a clients/ subdirectory) because kustomize's
# configMapGenerator keys ConfigMap entries by basename only - it can't
# preserve a nested directory structure across the mount.
client_id: "example_client-l2"
client_name: "Example Client"
jwks_url: "https://jwks.example-client.example/.well-known/jwks.json"
auth_level: "L2"
