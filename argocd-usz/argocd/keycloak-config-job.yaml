# One-shot `terraform apply` against the running Keycloak, as an ArgoCD
# PostSync hook so it re-applies after every sync once Keycloak is reachable.
#
# APPROACH 1 (configMapGenerator): the Terraform module (.tf) and client/scope
# config are delivered as ConfigMaps — not baked into a configurator/tf-config
# image (Approach 2) — generated by kustomize (see
# kustomization.yaml) and mounted read-only under /cm/*. The container copies
# them into the layout Terraform expects (/workspace/terraform + /workspace/
# config), on a persistent PVC so terraform.tfstate survives Job re-runs.
#
# Onboarding a client = add a file under keycloak-config/clients/ AND list it
# under the `kc-clients` configMapGenerator in kustomization.yaml, then commit.
# No image build. See README.md ("Migration to Approach 4") for how this
# evolves when the config graduates to a standalone data-as-code repo.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tf-workspace
  namespace: auth
  annotations:
    argocd.argoproj.io/sync-wave: '1'
spec:
  # StorageClass that exists in the USZ cluster (kubectl get storageclass).
  # NOTE: storageClassName is IMMUTABLE once the PVC is bound — it must match
  # the live PVC's class or ArgoCD's apply fails and blocks the whole sync.
  # If you change this, delete+recreate the PVC (loses terraform.tfstate; the
  # PostSync Job rebuilds it via terraform apply).
  storageClassName: usz-spol-ecp-sv01-vsan-pftt-r1-sfft-r5
  accessModes: ['ReadWriteOnce']
  resources:
    requests:
      storage: 1Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-config
  namespace: auth
  annotations:
    argocd.argoproj.io/hook: PostSync
    # BeforeHookCreation clears the previous Job before a new sync's Job is
    # created; without it a failed Job would persist and the next sync's
    # identical-spec Job would no-op, so terraform would never re-run.
    # HookSucceeded is deliberately omitted so the finished Job (and its logs)
    # sticks around for inspection until the next sync.
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: regcred
      # Satisfies the namespace's "restricted" PodSecurity level. runAsNonRoot
      # + non-zero runAsUser are required (the terraform image defaults to
      # root). fsGroup makes the mounted PVC group-writable so the uid-1000
      # process can write terraform.tfstate and copy in the config.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: terraform-apply
          # `hashicorp/terraform` here is only the kustomize match key — the
          # images: block in kustomization.yaml rewrites it to the Harbor
          # tf-provider-mirror:<tag> image (a terraform image with the keycloak
          # + vault providers baked in as a filesystem mirror). So `terraform
          # init` runs FULLY OFFLINE — no registry.terraform.io fetch. See
          # README.md ("Terraform provider fetch").
          image: hashicorp/terraform:1.15
          imagePullPolicy: IfNotPresent
          workingDir: /workspace/terraform
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          command:
            - sh
            - -c
            - |
              set -e
              mkdir -p /workspace/terraform /workspace/keycloak-config/clients
              # Copy from the read-only ConfigMap mounts into the writable PVC,
              # dereferencing the ConfigMap symlinks (-L). Explicit globs avoid
              # copying the ConfigMap's internal ..data/ entries.
              cp -L /cm/terraform/*.tf /workspace/terraform/
              cp -L /cm/terraform/.terraform.lock.hcl /workspace/terraform/
              cp -L /cm/scopes/scopes.yaml /workspace/keycloak-config/scopes.yaml
              cp -L /cm/clients/*.yaml /workspace/keycloak-config/clients/
              cd /workspace/terraform
              terraform init -input=false
              terraform apply -auto-approve -input=false
          env:
            # uid 1000 has no /etc/passwd home; point HOME at the writable tmp
            # emptyDir so terraform's ~/.terraform.d writes don't fail.
            - name: HOME
              value: /tmp
            # Backchannel admin API — in-cluster Service DNS.
            - name: TF_VAR_keycloak_url
              value: http://keycloak:8080
            # Public issuer URL — written into the token `aud` (ecosystem
            # audience mapper). MUST match KC_HOSTNAME, i.e. the EXTERNAL host
            # clients use (auth-test.umzhconnect.ch), NOT the internal ingress
            # host — or issued tokens' aud won't line up with their iss.
            - name: TF_VAR_keycloak_public_url
              value: https://auth-test.umzhconnect.ch
            - name: TF_VAR_keycloak_admin_username
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin
                  key: admin-username
            - name: TF_VAR_keycloak_admin_password
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin
                  key: admin-password
            # Leave "false" unless a hospital specifically needs an L1
            # (client_secret) debug client provisioned (ADR 0004).
            - name: TF_VAR_allow_l1_debug_clients
              value: 'false'
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: cm-terraform
              mountPath: /cm/terraform
              readOnly: true
            - name: cm-scopes
              mountPath: /cm/scopes
              readOnly: true
            - name: cm-clients
              mountPath: /cm/clients
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: tf-workspace
        # ConfigMap names below are the generator base names; kustomize rewrites
        # them to the hashed names (kc-terraform-xxxx) so a config change rolls
        # the Job and re-applies.
        - name: cm-terraform
          configMap:
            name: kc-terraform
        - name: cm-scopes
          configMap:
            name: kc-scopes
        - name: cm-clients
          configMap:
            name: kc-clients
        - name: tmp
          emptyDir: {}
