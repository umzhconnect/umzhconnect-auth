# Routes cluster-internal traffic to Keycloak. The Ingress matches the
# INTERNAL host `auth.dev.umzhc.io.usz.ch` — that's the name traffic arrives
# with at the nginx ingress controller.
#
# The EXTERNAL name clients use, `auth-test.umzhconnect.ch`, is exposed
# outward by an outer layer (external LB / reverse proxy) that forwards to
# this internal host. That external name is what appears in token iss/aud and
# is pinned via KC_HOSTNAME in keycloak.yaml (NOT set here) — so the issuer
# stays the external name regardless of the Host header forwarded inward.
#
# cert-manager issues the TLS cert for the internal host below; external TLS
# for auth-test.umzhconnect.ch is handled by the outer layer.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak
  namespace: auth
  annotations:
    # Internal cluster ACME issuer that can issue for *.dev.umzhc.io.usz.ch.
    cert-manager.io/cluster-issuer: clusterissuer-acme-nginx
    # Keycloak access tokens + headers can be large; give nginx room so it
    # doesn't 502 on big upstream response headers.
    nginx.ingress.kubernetes.io/proxy-buffer-size: '16k'
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - auth.dev.umzhc.io.usz.ch
      secretName: auth.dev.umzhc.io.usz.ch-cert
  rules:
    - host: auth.dev.umzhc.io.usz.ch
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 8080
