# UMZH Connect realm client scopes (USZ test deployment).
#
# Terraform (scopes.tf) reads this file to create each scope and register it
# as an OPTIONAL scope on every M2M client — least privilege per request.
# Kept identical to keycloak-config/scopes.yaml in the main repo so the test
# realm's scope vocabulary matches the sandbox. Edit here to diverge for USZ.

scopes:
  - name: "system/Task.crus"
    description: "SMART system scope: create/read/update/search Tasks"
  - name: "system/ServiceRequest.rs"
    description: "SMART system scope: read and search ServiceRequests"
  - name: "system/ServiceRequest.r"
    description: "SMART system scope: read ServiceRequests"
  - name: "system/Patient.r"
    description: "SMART system scope: read Patient demographics"
  - name: "system/Condition.r"
    description: "SMART system scope: read Conditions"
  - name: "system/MedicationStatement.r"
    description: "SMART system scope: read MedicationStatements"
  - name: "system/AllergyIntolerance.r"
    description: "SMART system scope: read AllergyIntolerances"
  - name: "system/Coverage.r"
    description: "SMART system scope: read Coverage (insurance)"
  - name: "system/Observation.r"
    description: "SMART system scope: read Observations"
  - name: "system/Procedure.r"
    description: "SMART system scope: read Procedures"
  - name: "system/Immunization.r"
    description: "SMART system scope: read Immunizations"
  - name: "system/DiagnosticReport.r"
    description: "SMART system scope: read DiagnosticReports"
  - name: "system/DocumentReference.r"
    description: "SMART system scope: read DocumentReferences"
  - name: "system/QuestionnaireResponse.r"
    description: "SMART system scope: read QuestionnaireResponses"
  - name: "system/Questionnaire.rs"
    description: "SMART system scope: read and search Questionnaires"
  - name: "system/ImagingStudy.r"
    description: "SMART system scope: read ImagingStudies"
  - name: "system/Organization.r"
    description: "SMART system scope: read Organizations"
  - name: "system/Practitioner.r"
    description: "SMART system scope: read Practitioners"
  - name: "system/PractitionerRole.r"
    description: "SMART system scope: read PractitionerRoles"
  - name: "system/Appointment.r"
    description: "SMART system scope: read Appointments"
  - name: "system/Medication.r"
    description: "SMART system scope: read Medications"
  - name: "smart-patient-read"
    description: "SMART on FHIR: Read patient data"
  - name: "smart-task-write"
    description: "SMART on FHIR: Create/update tasks"
  - name: "smart-servicerequest-read"
    description: "SMART on FHIR: Read service requests"
  - name: "smart-clinical-read"
    description: "SMART on FHIR: Read clinical resources (conditions, medications, allergies, etc.)"
  - name: "smart-questionnaire-write"
    description: "SMART on FHIR: Create/update questionnaire responses"
