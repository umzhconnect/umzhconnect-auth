# PLAIN secret template — fill in and `kubectl apply -f`, or prefer the
# imperative `kubectl create secret` in README.md. Do NOT commit real values;
# move to sealed-secrets before tracking any real credential in git.
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-admin
  namespace: auth
type: Opaque
stringData:
  admin-username: 'REPLACE_ADMIN_USER'
  admin-password: 'REPLACE_ADMIN_PASSWORD'
