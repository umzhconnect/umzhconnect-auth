# PLAIN secret template — fill in and `kubectl apply -f`, or prefer the
# imperative `kubectl create secret` in README.md. Do NOT commit real values;
# move to sealed-secrets before tracking any real credential in git.
#
# These are the MANAGED Postgres credentials Keycloak connects with. The host,
# port, and db name are set (non-secret) in ../keycloak.yaml's KC_DB_URL.
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-db
  namespace: auth
type: Opaque
stringData:
  username: 'REPLACE_DB_USER'
  password: 'REPLACE_DB_PASSWORD'
